<!doctype html>
<meta charset="utf-8">
<title>Test JS</title>
<style>
html,body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#fff;text-align:center;overflow:hidden}
#t{margin-top:200px;font-size:44px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#u{font-size:30px;color:#c79a4b;margin-top:14px}
</style>
<div id="t">Le JavaScript ne marche pas ici</div>
<div id="u"></div>
<script>

document.getElementById('u').textContent = 'Pseudo reçu : ' + (u || '(rien)');
</script>
