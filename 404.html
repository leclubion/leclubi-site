<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — LeClubi</title>
<meta name="theme-color" content="#17181a">
<script>try{var _t=localStorage.getItem('leclubi-theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#17181a;--text:#ece8df;--muted:#9a978f;--accent:#c79a4b;--accent-ink:#17181a;--line:#2e3034}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ec;--text:#1d1e20;--muted:#6d6a63;--accent:#a97a2c;--accent-ink:#fff;--line:#ddd7ca}}
:root[data-theme="light"]{--bg:#f6f3ec;--text:#1d1e20;--muted:#6d6a63;--accent:#a97a2c;--accent-ink:#fff;--line:#ddd7ca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:24px 16px;overflow:hidden;position:relative}
body::before{content:"";position:absolute;left:50%;top:0;width:min(900px,140vw);height:70vh;transform:translateX(-50%);background:radial-gradient(ellipse 45% 100% at 50% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent 75%);pointer-events:none}
main{position:relative;text-align:center;max-width:460px}
img{height:190px;width:auto;filter:drop-shadow(0 10px 28px color-mix(in srgb,var(--accent) 45%,transparent));animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
h1{font-family:"Archivo Black",Inter,sans-serif;font-weight:400;font-size:clamp(34px,8vw,52px);margin:14px 0 6px;letter-spacing:.01em}
h1 span{color:var(--accent)}
p{color:var(--muted);line-height:1.55;margin:0 0 24px}
a{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
a:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="/leclubi-site/images-site/balise.png" alt="La Balise">
  <h1><span>404</span> · Perdu ?</h1>
  <p>La Balise a cherché partout, mais sa lumière n'éclaire rien à cette adresse. La page n'existe pas ou a changé de place.</p>
  <a href="/leclubi-site/">Retour à l'accueil</a>
</main>
</body>
</html>
